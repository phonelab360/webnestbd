// ==================== কাউন্টডাউন হুক (useCountdown ইমুলেশন) ====================
const useCountdown = (target) => {
  const [time, setTime] = React.useState(() => Math.max(0, target - Date.now()));
  React.useEffect(() => {
    const id = setInterval(() => { const diff = target - Date.now(); setTime(diff > 0 ? diff : 0); }, 1000);
    return () => clearInterval(id);
  }, [target]);
  const h = Math.floor(time / 3_600_000);
  const m = Math.floor((time % 3_600_000) / 60_000);
  const s = Math.floor((time % 60_000) / 1000);
  return { h, m, s };
};
